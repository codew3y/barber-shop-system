name: CI gates

# Automated testing gates: nothing reaches main (and Vercel) without
# typecheck, lint, unit tests, a production build, and the e2e suite
# passing against real Postgres + Redis services.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber_dev
          POSTGRES_DB: barber_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barber"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://barber:barber_dev@localhost:5432/barber_booking
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run db:seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run test:e2e
