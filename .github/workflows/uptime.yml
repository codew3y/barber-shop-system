name: Uptime monitor

# Solo-operator uptime monitor: polls /api/health and fails loudly on
# non-200 or database-down so GitHub notifies the owner. Heavier than
# Sentry Uptime / Better Stack but needs no extra account; migrate when
# paging or multi-region checks matter.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # run by hand from the Actions tab to test

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe health endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://barberhouseph.vercel.app' }}
        run: |
          body=$(curl -sS --max-time 30 "$APP_URL/api/health")
          echo "$body"
          hstatus=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))")
          hdb=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('checks',{}).get('database','?'))")
          if [ "$hstatus" != "ok" ] || [ "$hdb" != "ok" ]; then
            echo "::error::Uptime probe failed (status=$hstatus database=$hdb)"
            exit 1
          fi
          echo "Uptime probe passed (status=ok database=ok)"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack alert (GitHub already notifies on failure)."
            exit 0
          fi
          curl -sS --max-time 30 -X POST "$SLACK_WEBHOOK_URL" \
            -H 'content-type: application/json' \
            -d '{"text":":rotating_light: BarberHouse uptime probe FAILED — check Vercel/Neon and Sentry."}'
